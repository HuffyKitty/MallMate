services:
  db:
    # 标签便于阅读，摘要锁定昨晚实际下载并成功启动的镜像内容。
    image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: mallmate
      POSTGRES_USER: mallmate
      POSTGRES_PASSWORD: mallmate_dev_only
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mallmate -d mallmate"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  chroma:
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    ports:
      - "18000:8000"
    volumes:
      - ./data/chroma:/data

  minio:
    # 社区镜像仓库已停止公开分发；从官方 GitHub 固定开源标签构建本地镜像。
    build:
      context: .
      dockerfile: infrastructure/minio/Dockerfile
    image: mallmate-minio:release-2025-04-22
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: mallmate
      MINIO_ROOT_PASSWORD: mallmate_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MALLMATE_AUTH_ENABLED: "true"
      MALLMATE_DEMO_MODE: "false"
      MALLMATE_DATABASE_URL: postgresql+psycopg://mallmate:mallmate_dev_only@db:5432/mallmate
      MALLMATE_CORS_ORIGINS: http://localhost:3000
      MALLMATE_REDIS_URL: redis://redis:6379/0
      MALLMATE_CHROMA_HOST: chroma
      MALLMATE_CHROMA_PORT: 8000
      MALLMATE_CHROMA_COLLECTION: mallmate_knowledge
      MALLMATE_MINIO_ENDPOINT: http://minio:9000
      MALLMATE_MINIO_ACCESS_KEY: mallmate
      MALLMATE_MINIO_SECRET_KEY: mallmate_dev_only
      MALLMATE_MINIO_BUCKET: mallmate-evidence
      MALLMATE_LLM_ENABLED: ${MALLMATE_LLM_ENABLED:-false}
      MALLMATE_LLM_PROVIDER: dashscope
      MALLMATE_LLM_BASE_URL: ${MALLMATE_LLM_BASE_URL:-}
      MALLMATE_LLM_CHAT_MODEL: qwen-plus
      MALLMATE_LLM_INTENT_MODEL: qwen-flash
      MALLMATE_LLM_VISION_MODEL: qwen-vl-plus
      MALLMATE_LLM_EMBEDDING_MODEL: text-embedding-v4
      MALLMATE_LLM_RERANK_MODEL: qwen3-rerank
      MALLMATE_LLM_API_KEY: ${MALLMATE_LLM_API_KEY:-}
      MALLMATE_PROMETHEUS_ENABLED: "true"
    env_file:
      - ./backend/.env
    ports:
      - "18080:8000"
    # PostgreSQL 首次创建数据目录时会短暂启动再重启。
    # 如果迁移刚好撞上这个窗口，有限重试可在数据库稳定后自动恢复，
    # 同时避免配置或代码错误造成无限重启。
    restart: "on-failure:5"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      chroma:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:18080
        # compose.yaml 只用于本地开发，因此显式开放演示账号提示。
        NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "19090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    depends_on:
      - backend

